<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Какой ты персонаж?</title>
<style>
  body { font-family: Arial, sans-serif; background: #f0f8ff; margin: 0; padding: 15px; color: #333; }
  .container { max-width: 500px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  h1 { text-align: center; font-size: 22px; margin-bottom: 10px; }
  .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 20px; }
  .question { font-weight: bold; font-size: 16px; margin-bottom: 12px; }
  .answer { display: block; width: 100%; text-align: left; padding: 12px; margin-bottom: 8px; font-size: 15px; background: #f9f9f9; border: 2px solid #ddd; border-radius: 8px; cursor: pointer; }
  .answer:active { background: #e0e0e0; }
  .result-title { font-size: 20px; font-weight: bold; text-align: center; margin-bottom: 10px; }
  .result-text { font-size: 15px; line-height: 1.5; margin-bottom: 20px; }
  .restart { display: block; width: 100%; padding: 12px; font-size: 16px; background: #ff8c00; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
  .restart:active { background: #e07b00; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <h1>Какой ты персонаж?</h1>
  <p class="subtitle" id="subtitle">Выбирай вариант, который больше всего похож на тебя.</p>

  <div id="quiz-area">
    <div class="question" id="question-text"></div>
    <div id="answers"></div>
  </div>

  <div id="result-area" class="hidden">
    <div class="result-title" id="result-title"></div>
    <div class="result-text" id="result-text"></div>
    <button class="restart" onclick="restartQuiz()">Пройти ещё раз</button>
  </div>
</div>

<script>
var questions = [
  {
    text: "Что ты делаешь в свободный день?",
    answers: [
      { text: "Иду исследовать новое место", character: "Аня" },
      { text: "Остаюсь дома с книгой", character: "Борис" },
      { text: "Звоню другу и спрашиваю, нужна ли помощь", character: "Вера" },
      { text: "Придумываю весёлую игру или розыгрыш", character: "Гриша" }
    ]
  },
  {
    text: "В школьном проекте ты...",
    answers: [
      { text: "Беру самую смелую идею и веду команду", character: "Аня" },
      { text: "Собираю факты и делаю аккуратную презентацию", character: "Борис" },
      { text: "Помогаю всем и слежу, чтобы никого не забыли", character: "Вера" },
      { text: "Добавляю шутку и делаю проект интересным", character: "Гриша" }
    ]
  },
  {
    text: "Твой идеальный выходной?",
    answers: [
      { text: "Поход, велосипед или новое приключение", character: "Аня" },
      { text: "Тихий вечер с чаем и хорошей книгой", character: "Борис" },
      { text: "День с семьёй или помощь другу", character: "Вера" },
      { text: "Вечеринка, игры и смех с друзьями", character: "Гриша" }
    ]
  },
  {
    text: "Друг грустит. Что ты сделаешь?",
    answers: [
      { text: "Скажу: «Пойдём, найдём что-то интересное!»", character: "Аня" },
      { text: "Выслушаю и дам добрый совет", character: "Борис" },
      { text: "Обниму и помогу, чем смогу", character: "Вера" },
      { text: "Расскажу смешную историю", character: "Гриша" }
    ]
  },
  {
    text: "Что ты выберешь в кафе?",
    answers: [
      { text: "Что-то новое, что я ещё не пробовал", character: "Аня" },
      { text: "Любимый чай и десерт", character: "Борис" },
      { text: "То, чем можно поделиться с друзьями", character: "Вера" },
      { text: "Самое смешное название в меню", character: "Гриша" }
    ]
  },
  {
    text: "В новой компании ты...",
    answers: [
      { text: "Первым начинаю знакомиться", character: "Аня" },
      { text: "Сначала наблюдаю и слушаю", character: "Борис" },
      { text: "Подхожу к тому, кто стесняется", character: "Вера" },
      { text: "Шучу, чтобы все расслабились", character: "Гриша" }
    ]
  },
  {
    text: "Какое задание ты выберешь?",
    answers: [
      { text: "Организовать поход или квест", character: "Аня" },
      { text: "Найти информацию и сделать доклад", character: "Борис" },
      { text: "Помочь младшим с домашним заданием", character: "Вера" },
      { text: "Придумать конкурс с призами и шутками", character: "Гриша" }
    ]
  },
  {
    text: "Твой девиз?",
    answers: [
      { text: "«Вперёд, к приключениям!»", character: "Аня" },
      { text: "«Сначала подумай, потом сделай»", character: "Борис" },
      { text: "«Помоги другому — и мир станет добрее»", character: "Вера" },
      { text: "«Если можно пошутить — шути!»", character: "Гриша" }
    ]
  }
];

var descriptions = {
  "Аня": "Ты смелая и активная. Любишь приключения и не боишься пробовать новое. Ты ведёшь друзей за собой и заряжаешь их энергией.",
  "Борис": "Ты спокойный и умный. Любишь читать, думать и узнавать новое. Ты решаешь задачи внимательно и не спешишь с выводами.",
  "Вера": "Ты добрая и заботливая. Тебе важно, чтобы всем было хорошо. Ты всегда готова помочь и поддержать.",
  "Гриша": "Ты весёлый и хитрый. Любишь шутки, игры и сюрпризы. С тобой никогда не бывает скучно."
};

var currentQuestion = 0;
var scores = { "Аня": 0, "Борис": 0, "Вера": 0, "Гриша": 0 };

function showQuestion() {
  if (currentQuestion >= questions.length) {
    showResult();
    return;
  }

  var q = questions[currentQuestion];
  document.getElementById("question-text").innerHTML = q.text;

  var answersDiv = document.getElementById("answers");
  answersDiv.innerHTML = "";

  for (var i = 0; i < q.answers.length; i++) {
    var btn = document.createElement("button");
    btn.className = "answer";
    btn.innerHTML = q.answers[i].text;
    btn.setAttribute("data-character", q.answers[i].character);
    btn.onclick = function() {
      var char = this.getAttribute("data-character");
      scores[char] = scores[char] + 1;
      currentQuestion = currentQuestion + 1;
      showQuestion();
    };
    answersDiv.appendChild(btn);
  }
}

function showResult() {
  document.getElementById("quiz-area").className = "hidden";
  document.getElementById("subtitle").className = "hidden";

  var maxScore = 0;
  var winner = "";
  for (var char in scores) {
    if (scores[char] > maxScore) {
      maxScore = scores[char];
      winner = char;
    }
  }

  document.getElementById("result-title").innerHTML = "Ты — " + winner + "!";
  document.getElementById("result-text").innerHTML = descriptions[winner];
  document.getElementById("result-area").className = "";
}

function restartQuiz() {
  currentQuestion = 0;
  scores = { "Аня": 0, "Борис": 0, "Вера": 0, "Гриша": 0 };
  document.getElementById("quiz-area").className = "";
  document.getElementById("subtitle").className = "subtitle";
  document.getElementById("result-area").className = "hidden";
  showQuestion();
}

showQuestion();
</script>
</body>
</html>
